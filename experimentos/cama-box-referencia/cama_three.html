<!doctype html>
<meta charset="utf-8">
<title>Cama assada (three)</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1210" height="1190"></canvas>
<!-- o MESMO three do app (r168, build proprio) -->
<script src="../../v1.5/renderizador-v16-moveis/lib/three.min.js"></script>
<script>
// Cama assada no navegador, com a camera casada com a foto. Parametros na URL pra
// calibrar a luz contra o render do Cycles sem editar arquivo:
//   k=chave f=preenche h=hemisferio l=abajur e=ambiente x=exposicao tom=aces|agx
const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? +P.get(k) : d);
const W = 1210, H = 1190;
const cv = document.getElementById("c");
const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
ren.setPixelRatio(1);
ren.setSize(W, H, false);
ren.outputColorSpace = THREE.SRGBColorSpace;
ren.toneMapping = P.get("tom") === "agx" ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
ren.toneMappingExposure = num("x", 1.0);
ren.shadowMap.enabled = true;
ren.shadowMap.type = THREE.PCFSoftShadowMap;
const cena = new THREE.Scene();
// cor plana do quarto (o piso e o tapete do Cycles sao procedurais; aqui fica a media)
const SOBRE = { piso: [96, 78, 70], tapete: [128, 100, 86] };
const lin = (c) => new THREE.Color().setRGB(c[0] / 255, c[1] / 255, c[2] / 255, THREE.SRGBColorSpace);

(async () => {
  const J = await (await fetch("assado/cama.json")).json();
  const bin = await (await fetch("assado/cama.bin")).arrayBuffer();
  const tl = new THREE.TextureLoader();
  const fmt = P.get("fmt") || "webp";
  const tex = (n, srgb) => new Promise((ok, erro) => tl.load("assado/" + n + "." + fmt, (t) => {
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = 8;
    ok(t);
  }, undefined, erro));
  for (const o of J.objetos) {
    if (P.get("so_cama") && o.quarto) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(bin, o.pos, o.n * 3), 3));
    g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(bin, o.nor, o.n * 3), 3));
    if (o.uv !== undefined) g.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(bin, o.uv, o.n * 2), 2));
    const m = new THREE.MeshStandardMaterial({ roughness: o.rough, metalness: 0 });
    if (o.map) m.map = await tex(o.map, true);
    if (o.normalMap && !P.get("sem_relevo")) m.normalMap = await tex(o.normalMap, false);
    if (o.cor) m.color.setRGB(o.cor[0], o.cor[1], o.cor[2], THREE.LinearSRGBColorSpace);
    if (SOBRE[o.nome]) m.color.copy(lin(SOBRE[o.nome]));
    if (o.emissiva) { m.emissive.setRGB(1, 0.86, 0.7); m.emissiveIntensity = 3; }
    if (o.duplo) m.side = THREE.DoubleSide;
    const me = new THREE.Mesh(g, m);
    me.castShadow = me.receiveShadow = !o.emissiva;
    cena.add(me);
  }
  // ---- camera: a mesma do Cycles (camera.json), nivelada com deslocamento de lente
  const C = J.camera, L = C.location, yaw = C.rotation_euler[2];
  const hf = 2 * Math.atan(18 / C.lens_mm_sensor36);
  const vf = 2 * Math.atan(Math.tan(hf / 2) * H / W) * 180 / Math.PI;
  const cam = new THREE.PerspectiveCamera(vf, W / H, 0.05, 50);
  cam.position.set(L[0], L[2], -L[1]);                       // Blender z-cima -> three y-cima
  cam.lookAt(L[0] - Math.sin(yaw), L[2], -L[1] - Math.cos(yaw));
  const M = Math.max(W, H);
  cam.setViewOffset(W, H, C.shift_x * M, -C.shift_y * M, W, H);
  // ---- luz: as mesmas posicoes do Cycles; intensidade calibrada pela medicao
  const pB = (x, y, z) => new THREE.Vector3(x, z, -y);
  const chave = new THREE.DirectionalLight(0xfffaf7, num("k", 2.2));
  chave.position.copy(pB(2.4, -0.6, 2.7));
  chave.target.position.copy(pB(0.2, 0, 0.5));
  chave.castShadow = true;
  chave.shadow.mapSize.set(2048, 2048);
  Object.assign(chave.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 0.5, far: 8 });
  chave.shadow.bias = -0.0004;
  chave.shadow.normalBias = 0.02;
  cena.add(chave, chave.target);
  const pre = new THREE.DirectionalLight(0xfffaf2, num("f", 0.6));
  pre.position.copy(pB(0.6, -3.2, 2.2));
  pre.target.position.copy(pB(0, 0, 0.5));
  cena.add(pre, pre.target);
  cena.add(new THREE.HemisphereLight(0xf2f0f0, 0x6b5a50, num("h", 0.5)));
  const abajur = new THREE.PointLight(0xffd29a, num("l", 1.5), 0, 2);
  abajur.position.copy(pB(0.98, 0.78, 1.02));
  cena.add(abajur);
  // ambiente uniforme (o app monta o dele por textura; aqui basta cor e intensidade)
  const amb = new THREE.Scene();
  amb.background = lin([196, 196, 200]);
  cena.environment = new THREE.PMREMGenerator(ren).fromScene(amb).texture;
  cena.environmentIntensity = num("e", 0.35);
  cena.background = new THREE.Color(0x000000);
  const t0 = performance.now();
  ren.render(cena, cam);
  window.INFO = { calls: ren.info.render.calls, tris: ren.info.render.triangles,
                  ms_primeiro_quadro: Math.round(performance.now() - t0),
                  gpu: (ren.getContext().getParameter(ren.getContext().RENDERER) || "") };
  window.PRONTO = true;
})().catch((e) => { window.ERRO = String(e); window.PRONTO = true; });
</script>
