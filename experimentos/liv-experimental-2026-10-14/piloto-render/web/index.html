<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Liv Meio — splat</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #info { position: fixed; left: 12px; bottom: 12px; right: 12px; color: #fff; font: 13px/1.4 system-ui, sans-serif;
          background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 8px; pointer-events: none; }
  #fps { position: fixed; top: 10px; right: 12px; color: #fff; font: 12px monospace; background: rgba(0,0,0,.55);
         padding: 4px 6px; border-radius: 6px; }
  .cobre { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; background: rgba(17,17,17,.94); color: #fff; font: 16px/1.4 system-ui, sans-serif; text-align: center;
           padding: 24px; z-index: 2; }
  .cobre[hidden] { display: none; }
  #entrar { font: 600 17px system-ui, sans-serif; padding: 14px 26px; border: 0; border-radius: 999px; background: #e8dccb; color: #222; }
  #gire .icone { width: 34px; height: 58px; border: 3px solid #e8dccb; border-radius: 7px;
                 animation: gira 1.6s ease-in-out infinite; }
  @keyframes gira { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) } }
  /* em pé num aparelho de toque: pede para deitar */
  @media (orientation: portrait) and (pointer: coarse) { #gire.ativo { display: flex; } }
  #gire { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/build/three.module.js",
  "three/addons/": "./lib/three/examples/jsm/",
  "@sparkjsdev/spark": "./lib/spark.module.min.js"
} }
</script>
</head>
<body>
<div id="fps"></div>
<div id="info">Carregando…</div>
<div id="abertura" class="cobre">
  <div>Liv Ipanema · apartamento de meio</div>
  <button id="entrar" type="button">Entrar no apartamento</button>
  <div style="font-size:13px;opacity:.7">A visita abre em tela cheia, com o celular deitado.</div>
</div>
<div id="gire" class="cobre" role="alert"><div class="icone" aria-hidden="true"></div><div>Gire o celular para a horizontal</div></div>
<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh, SparkControls } from "@sparkjsdev/spark";

const q = new URLSearchParams(location.search);
const arquivo = q.get("arquivo") || "sala-sh1.sog";        // sala-sh0/sh1/sh3.sog (o .spz v4 não abre no Spark 2.2.0)
const info = document.getElementById("info"), fpsEl = document.getElementById("fps");

const renderer = new THREE.WebGLRenderer({ antialias: false });
// Num interior o custo é preenchimento: cada pixel soma muitas gaussianas. Ajustes por URL:
//   dpr  resolução (padrão 1.5)   std  maxStdDev (padrão do Spark √8 ≈ 2.83)   alfa  minAlpha
const num = (k, padrao) => q.has(k) ? +q.get(k) : padrao;
renderer.setPixelRatio(Math.min(devicePixelRatio, num("dpr", 1.5)));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 50);
const ajustes = { renderer };
if (q.has("std")) ajustes.maxStdDev = num("std");
if (q.has("alfa")) ajustes.minAlpha = num("alfa");
scene.add(new SparkRenderer(ajustes));

// O Blender usa Z para cima; o three, Y. Girar o splat leva (x, y, z) a (x, z, -y).
const blender = (x, y, z) => new THREE.Vector3(x, z, -y);
const t0 = performance.now();
const splat = new SplatMesh({ url: arquivo, onLoad: () => {
  info.textContent = `${arquivo} · dpr ${renderer.getPixelRatio()} · std ${ajustes.maxStdDev ?? "2.83"} · ` +
    `${(performance.now() - t0) / 1000 | 0} s · ` +
    "arraste para olhar, toque e segure para andar (no computador: WASD)";
} });
splat.rotation.x = -Math.PI / 2;
scene.add(splat);

// começa na cozinha olhando para a sala (vista v2 do piloto)
camera.position.copy(blender(-4.25, -1.25, 1.45));
camera.lookAt(blender(-0.5, -1.35, 0.95));
const controls = new SparkControls({ canvas: renderer.domElement });
controls.fpsMovement.moveSpeed = 1.2;
controls.pointerControls.pressMoveSpeed = 1.0;

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let quadros = 0, marca = performance.now();
renderer.setAnimationLoop(() => {
  controls.update(camera);
  renderer.render(scene, camera);
  quadros++;
  const agora = performance.now();
  if (agora - marca > 1000) { fpsEl.textContent = `${Math.round(quadros * 1000 / (agora - marca))} fps`; quadros = 0; marca = agora; }
});
window.__splat = { camera, splat, renderer };

// Tela cheia + horizontal. orientation.lock só vale em tela cheia e depois de um toque (Android/Chrome);
// no iPhone não existe, e o aviso "gire o celular" cobre a cena enquanto estiver em pé.
document.getElementById("entrar").addEventListener("click", async () => {
  document.getElementById("abertura").hidden = true;
  document.getElementById("gire").classList.add("ativo");
  try {
    await document.documentElement.requestFullscreen?.({ navigationUI: "hide" });
    await screen.orientation?.lock?.("landscape");
  } catch (e) { /* sem suporte: fica o aviso */ }
});
if (!matchMedia("(pointer: coarse)").matches) document.getElementById("abertura").hidden = true;  // computador entra direto
</script>
</body>
</html>
