<script id="experience-interaction">
  // Segurar os controles não deve iniciar seleção nem o menu nativo de toque prolongado.
  for (const type of ['selectstart', 'contextmenu']) {
    document.addEventListener(type, event => {
      if (!event.target.closest?.('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) {
        event.preventDefault();
      }
    }, true);
  }
</script>
