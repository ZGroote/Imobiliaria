<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudos de terrenos</title>
<script type="importmap">{"imports":{"viabilidade-three":"./vendor/three-viabilidade.min.js"}}</script>
<style>
:root{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#202b32;background:#f3f5f4}*{box-sizing:border-box}body{margin:0;padding:24px}header{max-width:1440px;margin:0 auto 18px}h1{font-size:clamp(1.55rem,3vw,2.2rem);margin:0 0 4px}header p{margin:0;color:#5c686c}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:18px}.list,.map-panel,.fiche{background:white;border:1px solid #dce2df;border-radius:14px}.list{padding:16px;align-self:start}.list h2,.fiche h2{font-size:1rem;margin:0 0 10px}.cards{display:grid;gap:8px}.card{width:100%;text-align:left;font:inherit;background:#fff;color:inherit;border:1px solid #d8e0dc;border-radius:10px;padding:11px;cursor:pointer}.card:hover,.card[aria-pressed=true]{border-color:#28715c;box-shadow:0 0 0 2px #28715c20}.card strong{display:block}.card small{color:#59676a}.card.failed{background:#f0f1f1;color:#717a7b;border-color:#e2e5e4;filter:grayscale(1)}.card .motive{display:block;margin-top:5px}.map-column{min-width:0;display:grid;gap:12px}.map-panel{position:relative;height:min(68vh,640px);min-height:380px;overflow:hidden;background:#eef0ed}.map-panel canvas{display:block;width:100%;height:100%}.map-label{position:absolute;left:12px;top:12px;background:#fffffff0;border-radius:8px;padding:7px 10px;font-weight:650}.attribution{position:absolute;right:8px;bottom:7px;background:#fffffff0;border-radius:5px;padding:3px 7px;font-size:.75rem}.map-state{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ffffffd9;border-radius:7px;padding:6px 10px;font-size:.84rem}.map-controls{position:absolute;right:10px;top:10px;display:flex;gap:6px}.map-controls button,.open{font:inherit;border:1px solid #ccd6d1;background:white;color:#244c40;border-radius:7px;padding:7px 10px;cursor:pointer}.map-controls button[aria-pressed=true]{background:#dcece5;border-color:#28715c}.fiche{padding:16px}.fiche-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.number{background:#f3f6f4;border-radius:8px;padding:9px}.number small{display:block;color:#66716e}.number strong{font-size:1.05rem}.preliminar{max-width:1440px;margin:18px auto 0;text-align:center;background:#fff4d4;border:1px solid #e7d18f;border-radius:10px;padding:10px 12px;font-weight:650;color:#594718}button:focus-visible,a:focus-visible{outline:3px solid #245f4e;outline-offset:2px}@media(max-width:800px){body{padding:16px 12px}.layout{grid-template-columns:1fr}.list{order:0}.map-column{order:1}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.map-panel{height:min(55vh,500px);min-height:330px}.numbers{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.cards{grid-template-columns:1fr}.card{padding:9px}.map-panel{height:min(52vh,450px);min-height:320px}.fiche-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header><h1>Estudos de terrenos</h1><p>Localização, volumes e números preliminares de cada terreno.</p></header>
<main class="layout"><section class="list" aria-labelledby="lista-titulo"><h2 id="lista-titulo">Terrenos em estudo</h2><div class="cards" id="cards" aria-live="polite"></div></section>
<section class="map-column"><div class="map-panel" id="map"><canvas id="cena" aria-label="Maquete 3D sobre o mapa"></canvas><span class="map-label" id="map-title">Selecione um terreno</span><div class="map-controls"><button id="modo" type="button" aria-pressed="false">Com térreo</button></div><span class="map-state" id="map-state" hidden></span><span class="attribution" id="attribution">© colaboradores do OpenStreetMap</span></div><section class="fiche"><div class="fiche-head"><h2 id="fiche-title">Ficha do terreno</h2><a class="open" id="open-study" hidden>abrir estudo completo</a></div><div class="numbers" id="numbers"></div><small id="lote-ref"></small></section></section></main>
<div class="preliminar">Estudo preliminar — números não conferidos com a prefeitura</div>
<script type="module">
import { THREE, OrbitControls } from 'viabilidade-three';
const FUNDO_PADRAO={url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',atribuicao:'© colaboradores do OpenStreetMap',zoom_max:19};
const R=6378137,PI=Math.PI, canvas=document.querySelector('#cena'), renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color('#eef0ed');const camera=new THREE.OrthographicCamera(-70,70,50,-50,.1,3000);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.maxPolarAngle=PI*.48;
scene.add(new THREE.HemisphereLight(0xffffff,0xcbd1cd,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-80,130,90);scene.add(sun);let generation=0,objects=[],activeTileImages=[];
function render(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);renderer.render(scene,camera)}controls.addEventListener('change',render);new ResizeObserver(render).observe(canvas);
function project(lon,lat,centerLon,centerLat,z){const n=256*2**z,px=(lon+180)/360*n,py=(1-Math.asinh(Math.tan(lat*PI/180))/PI)/2*n,cx=(centerLon+180)/360*n,cy=(1-Math.asinh(Math.tan(centerLat*PI/180))/PI)/2*n,scale=2*PI*R/n*Math.cos(centerLat*PI/180);return [(px-cx)*scale,(cy-py)*scale]}
function clear(){generation++;document.querySelector('#map').dataset.tilesLoaded='0';for(const img of activeTileImages)img.src='';activeTileImages=[];for(const o of objects){scene.remove(o);o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose();if(o.userData.image)o.userData.image.src=''}objects=[]}
function addPoly(points,material,height=0,z0=0){if(points.length<3)return;const shape=new THREE.Shape();points.forEach(([x,y],i)=>i?shape.lineTo(x,y):shape.moveTo(x,y));shape.closePath();const geo=height?new THREE.ExtrudeGeometry(shape,{depth:height,bevelEnabled:false}):new THREE.ShapeGeometry(shape);geo.rotateX(-PI/2);const mesh=new THREE.Mesh(geo,material);mesh.position.y=z0;scene.add(mesh);objects.push(mesh);return mesh}
function flatRing(ring,t,center,z){return ring.map(([lon,lat])=>project(lon,lat,...center,z))}
function fallback(t,center,z){const m=new THREE.MeshBasicMaterial({color:'#e8ebe8',side:THREE.DoubleSide});addPoly([[-180,-180],[180,-180],[180,180],[-180,180]],m)}
function loadTiles(t,z,center,token){const cx=Math.floor((center[0]+180)/360*256*2**z),cy=Math.floor((1-Math.asinh(Math.tan(center[1]*PI/180))/PI)/2*256*2**z),tx=Math.floor(cx/256),ty=Math.floor(cy/256);const radius=z>=18?2:1,jobs=[];for(let y=ty-radius;y<=ty+radius;y++)for(let x=tx-radius;x<=tx+radius;x++){const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{if(token!==generation)return;const x0=(x*256-cx)*2*PI*R/(256*2**z)*Math.cos(center[1]*PI/180),x1=((x+1)*256-cx)*2*PI*R/(256*2**z)*Math.cos(center[1]*PI/180),n0=(cy-y*256)*2*PI*R/(256*2**z)*Math.cos(center[1]*PI/180),n1=(cy-(y+1)*256)*2*PI*R/(256*2**z)*Math.cos(center[1]*PI/180);const tex=new THREE.CanvasTexture(img);tex.colorSpace='srgb';const mesh=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,n0-n1),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));mesh.rotation.x=-PI/2;mesh.position.set((x0+x1)/2,.1,-(n0+n1)/2);mesh.userData.image=img;scene.add(mesh);objects.push(mesh);document.querySelector('#map').dataset.tilesLoaded=String(Number(document.querySelector('#map').dataset.tilesLoaded||0)+1);render()};img.onerror=()=>{if(token!==generation)return;document.querySelector('#map-state').hidden=false;document.querySelector('#map-state').textContent='mapa indisponível';};const url=F.url.replace('{z}',z).replace('{x}',x).replace('{y}',y);img.src=url;jobs.push(img)}document.querySelector('#map').dataset.zoom=String(z);document.querySelector('#map').dataset.tilesRequested=String(jobs.length);activeTileImages=jobs;return jobs}
let F=FUNDO_PADRAO, dados=[];
async function fundo(){try{const r=await fetch('./fundo.json',{cache:'no-store'});if(!r.ok)throw 0;const f=await r.json();if(typeof f.url==='string'&&f.url.includes('{z}')&&(f.url.includes('{x}')||f.url.includes('{y}'))&&typeof f.atribuicao==='string')F={...FUNDO_PADRAO,...f}}catch{}document.querySelector('#attribution').textContent=F.atribuicao}
const fmt=v=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(v);
function summaryCard(t,s){const n=s?.numeros,nt=s?.numeros_terreo;const area=n?.area_lote?.valor??Number(t.motivo?.match(/\((\d+(?:\.\d+)?)\s*m²\)/)?.[1]);return `<button class="card ${t.status==='falhou'?'failed':''}" type="button" data-id="${t.id}" aria-pressed="false"><strong>${t.nome}</strong><small>${area?fmt(area)+' m² de lote':'Área não informada'}${n?` · ${n.andares.valor} pav / ${n.unidades.valor} aptos sem térreo · ${nt.andares.valor} pav / ${nt.unidades.valor} aptos com térreo`:''}</small>${t.status==='falhou'?`<span class="motive">${t.motivo||'Não foi possível gerar o estudo.'}</span>`:''}</button>`}
function showNumbers(s,withGround){const n=s?.[withGround?'numeros_terreo':'numeros'];if(!n){document.querySelector('#numbers').innerHTML='<p>Não há resumo para este terreno.</p>';return}const labels={andares:'Andares',unidades:'Apartamentos',vagas:'Vagas',area_privativa:'Área privativa',area_computavel:'Área computável',area_lote:'Área do lote'};document.querySelector('#numbers').innerHTML=Object.entries(labels).map(([k,label])=>`<div class="number"><small>${label}</small><strong>${fmt(n[k].valor)} ${n[k].unidade}</strong></div>`).join('')}
async function select(t){const token=(generation+1),center=t.centro,summary=t.resumo?await fetch(new URL('../projetista/vitrine/'+t.resumo,location.href)).then(r=>r.json()).catch(()=>null):null;clear();document.querySelectorAll('.card').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===t.id)));document.querySelector('#map-title').textContent=t.nome;document.querySelector('#map-state').hidden=true;document.querySelector('#fiche-title').textContent=t.nome;document.querySelector('#lote-ref').textContent=t.lote_ref||'';document.querySelector('#modo').hidden=t.status!=='ok';document.querySelector('#modo').setAttribute('aria-pressed','false');document.querySelector('#modo').textContent='Com térreo';showNumbers(summary,false);const link=document.querySelector('#open-study');if(summary){link.hidden=false;link.href=`./index.html?estilo=maquete&resumo=../projetista/vitrine/${t.id}/resumo.json`}else link.hidden=true;
const z=Math.min(18,Number(F.zoom_max)||19),lot=flatRing(t.lote_wgs84,t,center,z),lotFill=addPoly(lot,new THREE.MeshBasicMaterial({color:'#dff5e4',side:THREE.DoubleSide,transparent:true,opacity:.42}));lotFill.position.y=.18;const outlineShape=new THREE.Shape();lot.forEach(([x,y],i)=>i?outlineShape.lineTo(x,y):outlineShape.moveTo(x,y));outlineShape.closePath();const outlineGeo=new THREE.ShapeGeometry(outlineShape);outlineGeo.rotateX(-PI/2);const outline=new THREE.LineSegments(new THREE.EdgesGeometry(outlineGeo),new THREE.LineBasicMaterial({color:'#174c3b'}));outline.position.y=.28;scene.add(outline);objects.push(outline);outlineGeo.dispose();
const renderBuilding=()=>{const useGround=document.querySelector('#modo').getAttribute('aria-pressed')==='true',volumes=useGround?(t.volumes_terreo_wgs84||[]):(t.volumes_wgs84||[]),material=new THREE.MeshStandardMaterial({color:'#fffefa',roughness:.92}),glass=new THREE.MeshBasicMaterial({color:'#a9c9c9',transparent:true,opacity:.82,side:THREE.DoubleSide}),edges=new Map();for(const v of volumes){const ring=flatRing(v.base,t,center,z).filter((p,i,a)=>!i||Math.hypot(p[0]-a[i-1][0],p[1]-a[i-1][1])>.08);if(ring.length<3)continue;const shape=new THREE.Shape();ring.forEach(([x,y],i)=>i?shape.lineTo(x,y):shape.moveTo(x,y));shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth:v.altura_m,bevelEnabled:false});geo.rotateX(-PI/2);const mesh=new THREE.Mesh(geo,material);mesh.position.y=v.z0_m||0;scene.add(mesh);objects.push(mesh);const slabGeo=new THREE.ShapeGeometry(shape);slabGeo.rotateX(-PI/2);const slab=new THREE.Mesh(slabGeo,new THREE.MeshBasicMaterial({color:'#eeeae1',side:THREE.DoubleSide}));slab.position.y=(v.z0_m||0)+v.altura_m+.035;scene.add(slab);objects.push(slab);const level=v.z0_m||0;if(!edges.has(level))edges.set(level,new Map());for(let i=0;i<ring.length;i++){const a=ring[i],b=ring[(i+1)%ring.length],key=[a,b].map(p=>p.map(n=>Math.round(n*2)/2).join(',')).sort().join('|');edges.get(level).set(key,(edges.get(level).get(key)||0)+1)}}for(const v of volumes.filter(v=>v.uso==='unidade')){const ring=flatRing(v.base,t,center,z).filter((p,i,a)=>!i||Math.hypot(p[0]-a[i-1][0],p[1]-a[i-1][1])>.08),levelEdges=edges.get(v.z0_m||0);if(!levelEdges)continue;for(let i=0;i<ring.length;i++){const a=ring[i],b=ring[(i+1)%ring.length],dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy),key=[a,b].map(p=>p.map(n=>Math.round(n*2)/2).join(',')).sort().join('|');if(length<3||levelEdges.get(key)!==1)continue;const shape=new THREE.Shape();shape.moveTo(.18,1.05);shape.lineTo(length-.18,1.05);shape.lineTo(length-.18,2.25);shape.lineTo(.18,2.25);shape.closePath();const win=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:.04,bevelEnabled:false}),glass);win.rotation.y=Math.atan2(dy,dx);win.position.set(a[0]+dx*.09,(v.z0_m||0),-a[1]-dy*.09);scene.add(win);objects.push(win)}}render()};renderBuilding();document.querySelector('#modo').onclick=()=>{const b=document.querySelector('#modo');b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));b.textContent=b.getAttribute('aria-pressed')==='true'?'Sem térreo':'Com térreo';showNumbers(summary,b.getAttribute('aria-pressed')==='true');renderBuilding()};
const extent=Math.max(...lot.map(([x,y])=>Math.max(Math.abs(x),Math.abs(y))),30),height=Math.max(...(t.volumes_wgs84||[]).map(v=>(v.z0_m||0)+v.altura_m),15),span=Math.max(height*1.75,extent*2,110),aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight),targetHeight=height*.38;camera.position.set(span*.8,height+span*.7,span);camera.up.set(0,1,0);camera.lookAt(0,targetHeight,0);camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.updateProjectionMatrix();controls.target.set(0,targetHeight,0);controls.update();render();const imgs=loadTiles(t,z,center,token);document.querySelector('#attribution').textContent=F.atribuicao||FUNDO_PADRAO.atribuicao;return imgs}
async function main(){await fundo();const r=await fetch('../projetista/vitrine/indice.json');if(!r.ok)throw new Error('Índice de terrenos indisponível');dados=(await r.json()).terrenos;const summaries=await Promise.all(dados.map(t=>t.resumo?fetch(new URL('../projetista/vitrine/'+t.resumo,location.href)).then(r=>r.json()).catch(()=>null):null));document.querySelector('#cards').innerHTML=dados.map((t,i)=>summaryCard(t,summaries[i])).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>select(dados.find(t=>t.id===b.dataset.id)));const first=dados.find(t=>t.status==='ok');if(first)await select(first)}
main().catch(e=>{document.querySelector('#map-state').hidden=false;document.querySelector('#map-state').textContent='Não foi possível carregar os terrenos';console.error(e)});
</script></body></html>
